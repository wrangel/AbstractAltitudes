# Dependency updates, replacing the `pnpm dev -u` path in scripts/dev-deploy.sh.
#
# That flag deleted pnpm-lock.yaml and ran `pnpm up --latest`, which discarded
# the lockfile and pulled unreviewed major versions straight onto the machine.
# Since Dockerfile.* and .github/workflows/ci.yml both install with
# --frozen-lockfile, that file is the contract for what actually ships — it
# should change through a reviewed PR that CI has run against, not as a side
# effect of starting a dev server.
#
# Homebrew is deliberately absent: it is per-machine, needs no review, and a
# GitHub runner has its own. That stays a local chore.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # Minor and patch bundled into two PRs a week — low noise, low risk.
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors are deliberately left out of the groups above, so each arrives as
    # its own PR and gets read rather than rubber-stamped. A vite 8→9 or
    # React 19→20 is exactly the change that breaks the prerender or the
    # viewers, and CI does not build the frontend (see ci.yml) — so those want
    # a local `pnpm test` before merging.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
